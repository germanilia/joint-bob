version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"
      compatible-updates:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"
